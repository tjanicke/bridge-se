# Runs the engine regression tests (tests/run.cjs) on every push and pull request. Node only, no packages.
# A red check means a benchmark or audit case moved; the server still pulls on its own schedule, so look before you push.
name: Engine tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.cjs
