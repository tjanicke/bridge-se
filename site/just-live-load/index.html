:root{

  --line:#dde1e7; --line-2:#c9ced6; --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e6edfd;
  --good:#15803d; --bad:#b91c1c; --warn-bg:#fff7e6; --warn-ink:#8a5300; --err-bg:#fdecec;
  --grid:#e8ebef; --zero:#9aa2ae; --pos-fill:rgba(29,78,216,.13); --neg-fill:rgba(185,28,28,.13);
  --c-hl93:#1d4ed8; --c-hs:#d9480f; --c-hsl:#92400e; --c-hsg:#111827; --c-fat:#6b7280; --c-lg:#0f766e; --c-p0:#15803d; --c-p1:#7c3aed; --c-p2:#be185d; --c-p3:#0e7490; --c-p4:#a16207;

}

    --bg:#0f1216; --panel:#171b21; --panel-2:#1c2128; --ink:#e7eaee; --ink-2:#b2b9c4; --ink-3:#848c99;
    --line:#2a3039; --line-2:#363d48; --accent:#6d9bff; --accent-ink:#0b1020; --accent-soft:#1d2a47;
    --good:#4ade80; --bad:#f87171; --warn-bg:#2d2412; --warn-ink:#f2c46d; --err-bg:#3a1d1d;
    --grid:#232931; --zero:#5a6370; --pos-fill:rgba(109,155,255,.16); --neg-fill:rgba(248,113,113,.16);
    --c-hl93:#6d9bff; --c-hs:#ff8a4c; --c-hsl:#e7b67a; --c-hsg:#f3f4f6; --c-fat:#9ca3af; --c-lg:#2dd4bf; --c-p0:#4ade80; --c-p1:#b794ff; --c-p2:#f472b6; --c-p3:#22d3ee; --c-p4:#facc15;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --panel:#171b21; --panel-2:#1c2128; --ink:#e7eaee; --ink-2:#b2b9c4; --ink-3:#848c99;
  --line:#2a3039; --line-2:#363d48; --accent:#6d9bff; --accent-ink:#0b1020; --accent-soft:#1d2a47;
  --good:#4ade80; --bad:#f87171; --warn-bg:#2d2412; --warn-ink:#f2c46d; --err-bg:#3a1d1d;
  --grid:#232931; --zero:#5a6370; --pos-fill:rgba(109,155,255,.16); --neg-fill:rgba(248,113,113,.16);
  --c-hl93:#6d9bff; --c-hs:#ff8a4c; --c-hsl:#e7b67a; --c-hsg:#f3f4f6; --c-fat:#9ca3af; --c-lg:#2dd4bf; --c-p0:#4ade80; --c-p1:#b794ff; --c-p2:#f472b6; --c-p3:#22d3ee; --c-p4:#facc15;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
.num,td.n,input.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-weight:700;letter-spacing:.02em}
.brand span{color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.btn{appearance:none;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;font:500 13px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.layout{display:grid;grid-template-columns:450px minmax(0,1fr);gap:16px;padding:16px 20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.inputs{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
fieldset{border:0;border-bottom:1px solid var(--line);margin:0;padding:14px 16px}
fieldset:last-child{border-bottom:0}
legend{float:left;width:100%;padding:0;margin:0 0 10px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
legend .sp{flex:1}
legend label.sw{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 10px;clear:both}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--ink-2)}
.fld.full{grid-column:1/-1}
input[type=text],input[type=number],select{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:5px;padding:6px 7px;font:13px var(--sans)}
input.n{font-size:12.5px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
label.chk input{accent-color:var(--accent);margin:0}
table.edit{width:100%;border-collapse:collapse;clear:both}
table.edit th{font-weight:500;font-size:11.5px;color:var(--ink-3);text-align:left;padding:0 4px 4px}
table.edit td{padding:2px 2px}
table.edit input{padding:5px 5px}
table.edit td.idx{color:var(--ink-3);font:12px var(--mono);width:22px;text-align:right;padding-right:6px}
table.edit td.x{width:26px}
.xbtn{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:3px 6px;border-radius:4px}
.xbtn:hover{color:var(--bad);background:var(--panel-2)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.check{font-size:12px;margin-top:6px;color:var(--ink-3)}
.check.ok{color:var(--good)} .check.bad{color:var(--bad)}
.permit{border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;background:var(--panel-2);clear:both}
.permit .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.permit .ph input[type=text]{font-weight:600}
.swatch{width:10px;height:10px;border-radius:2px;flex:none}
.sublbl{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;margin:14px 0 8px;padding-top:10px;border-top:1px dashed var(--line);clear:both}
.sublbl .sp{flex:1}
.sublbl label.chk{font-weight:400}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px;clear:both}
main.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{padding:16px}
.card h2{font-size:15px;margin:0 0 4px;font-weight:600}
.card .sub{color:var(--ink-3);font-size:12.5px;margin:0 0 12px}
.cardhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cardhead .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--panel);padding:12px 14px}
.stat .k{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font:500 18px var(--mono);margin-top:2px}
.stat .d{font-size:12px;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font:12.5px var(--sans);cursor:pointer}
.legend button.off{opacity:.45}
.legend button.off .swatch{background:transparent!important;border:1px solid var(--ink-3)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{font:11px var(--mono);fill:var(--ink-3)}
.chart .axl{font:11.5px var(--sans);fill:var(--ink-2)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:180px;z-index:5;display:none}
.tip .h{font-weight:600;margin-bottom:4px}
.tip table{border-collapse:collapse}
.tip td{padding:1px 6px 1px 0}
.tip td.n{text-align:right}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font:500 13px var(--sans);color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tablewrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:6px}
table.res{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}

table.res th.l,table.res td.l{text-align:left}
table.res th.grp{text-align:center;border-left:1px solid var(--line)}
table.res td{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
table.res td.gs{border-left:1px solid var(--line)}
table.res tbody tr{cursor:pointer}
table.res tbody tr:hover td{background:var(--panel-2)}
table.res tbody tr.sel td{background:var(--accent-soft)}
table.res tbody tr.sup td{font-weight:600}
td.neg{color:var(--bad)}
.ctl{color:var(--ink-3);font:11px var(--sans);display:block}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel-2)}
.dcard h3{font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.dcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12.5px}
.dcard dt{color:var(--ink-3)}
.dcard dd{white-space:nowrap;margin:0;font-family:var(--mono);text-align:right}
.dcard .pos{font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.35}
.msg{border-radius:6px;padding:10px 12px;font-size:13px}

.insum h3{font-size:12.5px;margin:10px 0 2px}
.muted{color:var(--ink-3)}
details.notes summary{cursor:pointer;font-weight:600}
details.notes ul{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
details.notes li{margin:3px 0}
.busy{font-size:12px;color:var(--ink-3)}
.ilctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ilctl select{width:auto;max-width:100%}
.printhead{display:none}
header.top{flex-wrap:wrap}
.app-identity{min-width:0;flex:1 1 390px;display:flex;align-items:center;gap:12px}
.app-identity-text{min-width:0}
.app-logo{display:block;flex:none;width:64px;height:64px;background:#f3f7fb;border:1px solid #d6e3ef;border-radius:10px;overflow:hidden}
.app-logo img{display:block;width:100%;height:100%;object-fit:contain}
.app-logo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.breadcrumbs{display:flex;gap:7px;align-items:center;margin:0 0 3px;font-size:11px;color:var(--ink-3)}
.breadcrumbs a{color:var(--ink-2);text-decoration:none;text-underline-offset:3px}
.breadcrumbs a:hover{text-decoration:underline;color:var(--accent)}
.breadcrumbs a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.brand h1{font-size:17px;line-height:1.3;font-weight:700;margin:0;white-space:nowrap;letter-spacing:-.02em}
.inputs{top:calc(var(--top-height,76px) + 16px);max-height:calc(100vh - var(--top-height,76px) - 32px)}
@media(max-width:980px){.app-identity{flex:1 0 100%}.inputs{top:auto;max-height:none}}

@media (max-width: 980px){
  .layout{grid-template-columns:minmax(0,1fr);padding:12px 16px}
  .inputs{position:static;max-height:none}
  header.top{padding:10px 16px;flex-wrap:wrap;position:static;gap:8px}
  header.top .btn{padding:6px 9px;font-size:12px}
  table.edit input{font-size:12px;padding:5px 3px}
  .brand span{display:none}
}
@media print{
  @page{size:landscape;margin:.4in}
  body{background:#fff;color:#000;font-size:10.5px}
  header.top,.inputs,.btn,.legend,.tabs,.noprint,.ilcard{display:none!important}
  .layout{display:block;padding:0}
  .panel{border:0}
  .card{padding:6px 0;break-inside:avoid}
  .tablewrap{max-height:none;overflow:visible;border:0}
  .tabpane{display:block!important;margin-bottom:12px}
  table.res th{position:static}
  .printhead{display:block;margin-bottom:8px}
  .printonly{display:block!important}
  .card.insum{break-inside:auto}
  table.kv tr{break-inside:avoid}
  details.notes{display:none!important}
}

<script>
/* ==========================================================================
   Open DOT · Continuous Beam Live Load Engine
   Stiffness-method continuous beam (variable E·I segments), exact influence
   lines from Hermite equivalent nodal loads, moving-load envelopes for
   AASHTO LRFD HL-93, AASHTO Standard (LFD) HS-series, and custom permits.
   Units: ft, kip, kip-ft.  E in ksi, I in in^4.
   ========================================================================== */
const ConsysEngine = (() => {
  'use strict';
  const EPS = 1e-6;

  const num = (v, d) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
  const fmt = v => (Math.round(v * 1000) / 1000).toString();

  /* ---------------- Model / mesh / stiffness ---------------- */
  function buildModel(inp) {
    const errors = [];
    const spans = (inp.spans || []).map(v => num(v, NaN));
    if (!spans.length) errors.push('Define at least one span.');
    spans.forEach((L, i) => { if (!(L > 0)) errors.push(`Span ${i + 1}: length must be greater than 0.`); });
    const sup = [0]; let acc = 0;
    for (const L of spans) { acc += L; sup.push(acc); }
    const Ltot = acc;

    const segs = []; let s0 = 0;
    (inp.segments || []).forEach((g, i) => {
      const len = num(g.len, NaN), E = num(g.E, NaN), I1 = num(g.I1, NaN);
      let I2 = num(g.I2, NaN); if (!Number.isFinite(I2)) I2 = I1;
      if (!(len > 0)) errors.push(`Segment ${i + 1}: length must be greater than 0.`);
      if (!(E > 0)) errors.push(`Segment ${i + 1}: E must be greater than 0.`);
      if (!(I1 > 0) || !(I2 > 0)) errors.push(`Segment ${i + 1}: I must be greater than 0.`);
      segs.push({ x0: s0, x1: s0 + len, E, I1, I2 }); s0 += len;
    });
    if (!segs.length) errors.push('Define at least one segment.');
    else if (errors.length === 0 && Math.abs(s0 - Ltot) > 0.01)
      errors.push(`Segment lengths total ${fmt(s0)} ft but spans total ${fmt(Ltot)} ft. They must match.`);
    if (errors.length) return { errors };
    segs[segs.length - 1].x1 = Ltot;

    const spanOf = x => { for (let i = 0; i < spans.length; i++) if (x < sup[i + 1] - EPS) return i; return spans.length - 1; };

    /* analysis sections */
    const div = Math.max(1, Math.min(100, Math.round(num(inp.divisions, 10))));
    const sections = [];
    spans.forEach((L, i) => {
      for (let k = 0; k <= div; k++) {
        const fr = k / div;
        sections.push({ span: i, frac: fr, x: sup[i] + fr * L, side: k === 0 ? 'R' : (k === div ? 'L' : 'B'), kind: 'pt' });
      }
    });
    const addPoint = (x, kind) => {
      if (!(x > EPS && x < Ltot - EPS)) return;
      if (sup.some(s => Math.abs(s - x) < 1e-3)) return;
      if (sections.some(s => Math.abs(s.x - x) < 1e-3)) return;
      const i = spanOf(x);
      sections.push({ span: i, frac: (x - sup[i]) / spans[i], x, side: 'B', kind });
    };
    if (inp.segPts) segs.slice(0, -1).forEach(g => addPoint(g.x1, 'seg'));
    String(inp.extraPts || '').split(/[,;\s]+/).map(Number).filter(Number.isFinite).forEach(x => addPoint(x, 'user'));
    const sideOrd = { L: 0, B: 1, R: 2 };
    sections.sort((a, b) => (a.x - b.x) || (sideOrd[a.side] - sideOrd[b.side]));

    /* mesh */
    let keys = [...sup, ...segs.map(g => g.x0), ...sections.map(s => s.x)].sort((a, b) => a - b);
    const uk = [];
    for (const k of keys) if (!uk.length || k - uk[uk.length - 1] > 1e-6) uk.push(k);
    if (Math.abs(uk[uk.length - 1] - Ltot) > 1e-6) uk.push(Ltot);
    const meshN = Math.max(20, num(inp.meshPerSpan, 60));
    const hmax = Math.max(0.1, Math.min(...spans) / meshN);
    const nodes = [];
    for (let i = 0; i < uk.length - 1; i++) {
      const a = uk[i], b = uk[i + 1], n = Math.max(1, Math.ceil((b - a) / hmax - 1e-9));
      for (let k = 0; k < n; k++) nodes.push(a + (b - a) * k / n);
    }
    nodes.push(Ltot);
    const N = nodes.length;
    const EI = new Float64Array(N - 1);
    for (let e = 0; e < N - 1; e++) {
      const xm = 0.5 * (nodes[e] + nodes[e + 1]);
      let g = segs.find(s => xm >= s.x0 - EPS && xm <= s.x1 + EPS) || segs[segs.length - 1];
      const t = (g.x1 - g.x0) > 0 ? (xm - g.x0) / (g.x1 - g.x0) : 0;
      const I = g.I1 + (g.I2 - g.I1) * t;
      EI[e] = g.E * I / 144; // ksi*in^4 -> kip*ft^2
    }
    const nearest = x => { let lo = 0, hi = N - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (nodes[m] <= x) lo = m; else hi = m; } return Math.abs(nodes[lo] - x) < Math.abs(nodes[hi] - x) ? lo : hi; };
    const supNode = sup.map(nearest);

    /* DOFs: v = 2n, theta = 2n+1. Vertical restraint at supports. */
    const ndof = 2 * N, nsup = sup.length;
    const restrSup = new Int32Array(ndof).fill(-1);
    supNode.forEach((n, j) => { restrSup[2 * n] = j; });
    const freeIdx = new Int32Array(ndof).fill(-1);
    let nf = 0; for (let d = 0; d < ndof; d++) if (restrSup[d] < 0) freeIdx[d] = nf++;
    const bw = 3, W = 2 * bw + 1;
    const Kb = new Float64Array(nf * W);
    const Kfr = Array.from({ length: nsup }, () => new Float64Array(nf));
    for (let e = 0; e < N - 1; e++) {
      const h = nodes[e + 1] - nodes[e], c = EI[e] / (h * h * h);
      const k = [
        [12, 6 * h, -12, 6 * h],
        [6 * h, 4 * h * h, -6 * h, 2 * h * h],
        [-12, -6 * h, 12, -6 * h],
        [6 * h, 2 * h * h, -6 * h, 4 * h * h]];
      const dofs = [2 * e, 2 * e + 1, 2 * e + 2, 2 * e + 3];
      for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
        const fa = freeIdx[dofs[a]], fb = freeIdx[dofs[b]];
        const v = c * k[a][b];
        if (fa >= 0 && fb >= 0) Kb[fa * W + (fb - fa + bw)] += v;
        else if (fa >= 0 && fb < 0) Kfr[restrSup[dofs[b]]][fa] += v;
      }
    }
    /* banded LU (SPD, no pivoting) */
    for (let k = 0; k < nf; k++) {
      const piv = Kb[k * W + bw];
      if (!(Math.abs(piv) > 1e-12)) return { errors: ['Structure is unstable (singular stiffness). Check spans and supports.'] };
      const iEnd = Math.min(nf - 1, k + bw);
      for (let i = k + 1; i <= iEnd; i++) {
        const f = Kb[i * W + (k - i + bw)] / piv;
        if (f === 0) continue;
        Kb[i * W + (k - i + bw)] = f;
        for (let j = k + 1; j <= iEnd; j++) Kb[i * W + (j - i + bw)] -= f * Kb[k * W + (j - k + bw)];
      }
    }
    const solve = rhs => {
      const x = Float64Array.from(rhs);
      for (let i = 0; i < nf; i++) { let s = x[i]; for (let k = Math.max(0, i - bw); k < i; k++) s -= Kb[i * W + (k - i + bw)] * x[k]; x[i] = s; }
      for (let i = nf - 1; i >= 0; i--) { let s = x[i]; for (let j = i + 1; j <= Math.min(nf - 1, i + bw); j++) s -= Kb[i * W + (j - i + bw)] * x[j]; x[i] = s / Kb[i * W + bw]; }
      return x;
    };
    const G = Kfr.map(col => solve(col)); // G[j][f] = (K_rf K_ff^-1)[j][f]

    const model = { spans, sup, Ltot, segs, sections, nodes, EI, supNode, nsup, freeIdx, restrSup, G, spanOf, div };

    /* responses: M and V at each section, reactions at each support */
    const resp = [];
    sections.forEach((s, si) => {
      const cM = new Float64Array(nsup), cV = new Float64Array(nsup);
      for (let j = 0; j < nsup; j++) {
        if (sup[j] < s.x - EPS) { cM[j] = s.x - sup[j]; cV[j] = 1; }
        else if (s.side === 'R' && Math.abs(sup[j] - s.x) <= EPS) cV[j] = 1;
      }
      s.iM = resp.length; resp.push({ type: 'M', sec: si, x: s.x, c: cM });
      s.iV = resp.length; resp.push({ type: 'V', sec: si, x: s.x, c: cV });
    });
    model.reactRows = [];
    for (let j = 0; j < nsup; j++) {
      const c = new Float64Array(nsup); c[j] = 1;
      model.reactRows.push(resp.length);
      resp.push({ type: 'R', j, x: sup[j], c });
    }
    model.resp = resp;
    return model;
  }

  /* reactions (upward +) for a unit downward load at a. Returns false if off the beam */
  function reactions(m, a, out) {
    out.fill(0);
    if (a < -EPS || a > m.Ltot + EPS) return false;
    a = Math.min(Math.max(a, 0), m.Ltot);
    const nd = m.nodes, N = nd.length;
    let lo = 0, hi = N - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (nd[mid] <= a) lo = mid; else hi = mid; }
    const e = Math.min(lo, N - 2), h = nd[e + 1] - nd[e], xi = (a - nd[e]) / h;
    const xi2 = xi * xi, xi3 = xi2 * xi;
    const F = [-(1 - 3 * xi2 + 2 * xi3), -h * xi * (1 - xi) * (1 - xi), -(3 * xi2 - 2 * xi3), -h * xi2 * (xi - 1)];
    const dofs = [2 * e, 2 * e + 1, 2 * e + 2, 2 * e + 3];
    for (let k = 0; k < 4; k++) {
      const f = m.freeIdx[dofs[k]];
      if (f >= 0) { if (F[k] !== 0) for (let j = 0; j < m.nsup; j++) out[j] += m.G[j][f] * F[k]; }
      else out[m.restrSup[dofs[k]]] -= F[k];
    }
    return true;
  }

  /* unit-load response values at every response (max-limit and min-limit for shear discontinuity) */
  function unitValues(m, a, R, mx, mn) {
    if (!reactions(m, a, R)) return false;
    const resp = m.resp, ns = m.nsup;
    for (let r = 0; r < resp.length; r++) {
      const q = resp[r], c = q.c;
      let b = 0; for (let j = 0; j < ns; j++) b += c[j] * R[j];
      if (q.type === 'M') { const v = b - (a < q.x ? q.x - a : 0); mx[r] = v; mn[r] = v; }
      else if (q.type === 'V') {
        if (Math.abs(a - q.x) <= EPS) { mx[r] = b; mn[r] = b - 1; }
        else { const v = b - (a < q.x ? 1 : 0); mx[r] = v; mn[r] = v; }
      } else { mx[r] = b; mn[r] = b; }
    }
    return true;
  }

  /* ---------------- Influence line sampling & lane integrals ---------------- */
  function influenceData(m, sub = 4) {
    const xs = [];
    for (let i = 0; i < m.nodes.length - 1; i++) for (let k = 0; k < sub; k++) xs.push(m.nodes[i] + (m.nodes[i + 1] - m.nodes[i]) * k / sub);
    xs.push(m.Ltot);
    const ns = m.nsup, nsx = xs.length, Rs = new Float64Array(nsx * ns), R = new Float64Array(ns);
    xs.forEach((a, i) => { reactions(m, a, R); Rs.set(R, i * ns); });
    const nsp = m.spans.length;
    const il = m.resp.map(q => {
      const X = [], Y = [];
      for (let i = 0; i < nsx; i++) {
        const a = xs[i]; let b = 0;
        for (let j = 0; j < ns; j++) b += q.c[j] * Rs[i * ns + j];
        if (q.type === 'M') { X.push(a); Y.push(b - (a < q.x ? q.x - a : 0)); }
        else if (q.type === 'V') {
          if (Math.abs(a - q.x) <= EPS) { X.push(a, a); Y.push(b - 1, b); }
          else { X.push(a); Y.push(b - (a < q.x ? 1 : 0)); }
        } else { X.push(a); Y.push(b); }
      }
      let pos = 0, neg = 0, mxO = 0, mxX = 0, mnO = 0, mnX = 0;
      const spanMin = new Array(nsp).fill(0), spanMinX = new Array(nsp).fill(0);
      for (let i = 0; i < X.length; i++) {
        const y = Y[i];
        if (y > mxO) { mxO = y; mxX = X[i]; }
        if (y < mnO) { mnO = y; mnX = X[i]; }
        const s = m.spanOf(X[i]);
        if (y < spanMin[s]) { spanMin[s] = y; spanMinX[s] = X[i]; }
        if (i === 0) continue;
        const dx = X[i] - X[i - 1]; if (dx <= 0) continue;
        const y0 = Y[i - 1], y1 = y;
        if (y0 >= 0 && y1 >= 0) pos += 0.5 * (y0 + y1) * dx;
        else if (y0 <= 0 && y1 <= 0) neg += 0.5 * (y0 + y1) * dx;
        else { const t = y0 / (y0 - y1), d0 = t * dx, d1 = dx - d0;
          if (y0 > 0) { pos += 0.5 * y0 * d0; neg += 0.5 * y1 * d1; } else { neg += 0.5 * y0 * d0; pos += 0.5 * y1 * d1; } }
      }
      return { X, Y, pos, neg, maxOrd: mxO, maxX: mxX, minOrd: mnO, minX: mnX, spanMin, spanMinX };
    });
    return il;
  }

  /* ---------------- Moving vehicle ---------------- */
  // veh: {weights:[..], spacings:[..], varIndex:-1|k, varMin, varMax, varInc}
  function runVehicle(m, veh, opt) {
    const nr = m.resp.length, step = Math.max(0.05, opt.step || 0.5);
    const neglect = !!opt.neglect;
    const maxV = new Float64Array(nr), minV = new Float64Array(nr);
    const maxInfo = Array(nr).fill(null), minInfo = Array(nr).fill(null);
    const variants = [];
    if (veh.varIndex >= 0) {
      const inc = Math.max(0.1, veh.varInc || 1);
      for (let s = veh.varMin; s <= veh.varMax + 1e-9; s += inc) variants.push(s);
      if (Math.abs(variants[variants.length - 1] - veh.varMax) > 1e-9) variants.push(veh.varMax);
    } else variants.push(null);
    const cache = new Map();
    const R = new Float64Array(m.nsup);
    const getU = a => {
      const key = Math.round(a * 1e4);
      let u = cache.get(key);
      if (!u) {
        if (cache.size > 30000) cache.clear();
        const mx = new Float64Array(nr), mn = new Float64Array(nr);
        const on = unitValues(m, a, R, mx, mn);
        u = on ? { mx, mn } : null; cache.set(key, u);
      }
      return u;
    };
    const critX = [...m.sections.map(s => s.x), ...m.sup];
    const rec = opt.record ? { recordVar: opt.recordVar, idx: opt.record, f: {} } : null;
    const smax = new Float64Array(nr), smin = new Float64Array(nr);

    for (const vs of variants) {
      const sp = veh.spacings.slice(); if (vs !== null) sp[veh.varIndex] = vs;
      const off = [0]; sp.forEach(s => off.push(off[off.length - 1] + s));
      const W = veh.weights, len = off[off.length - 1];
      const p0 = -len - step, p1 = m.Ltot + len + step;
      const nGrid = Math.ceil((p1 - p0) / step) + 1;
      const doRec = rec && (vs === null ? rec.recordVar == null : Math.abs(vs - rec.recordVar) < 1e-9);
      for (const dir of [1, -1]) {
        let fr = null;
        if (doRec) { fr = rec.idx.map(() => ({ mx: new Float64Array(nGrid), mn: new Float64Array(nGrid) })); rec.f[dir] = { arr: fr, p0, step, n: nGrid, len }; }
        const crit = [];
        for (const x of critX) for (const o of off) crit.push(x + dir * o);
        const total = nGrid + crit.length;
        for (let k = 0; k < total; k++) {
          const p = k < nGrid ? p0 + k * step : crit[k - nGrid];
          smax.fill(0); smin.fill(0);
          let any = false;
          for (let i = 0; i < W.length; i++) {
            const u = getU(p - dir * off[i]); if (!u) continue; any = true;
            const P = W[i], ux = u.mx, un = u.mn;
            if (neglect) for (let r = 0; r < nr; r++) { if (ux[r] > 0) smax[r] += P * ux[r]; if (un[r] < 0) smin[r] += P * un[r]; }
            else for (let r = 0; r < nr; r++) { smax[r] += P * ux[r]; smin[r] += P * un[r]; }
          }
          if (fr && k < nGrid) rec.idx.forEach((r, q) => { fr[q].mx[k] = smax[r]; fr[q].mn[k] = smin[r]; });
          if (!any) continue;
          for (let r = 0; r < nr; r++) {
            if (smax[r] > maxV[r] + 1e-9) { maxV[r] = smax[r]; maxInfo[r] = { p, dir, vs }; }
            if (smin[r] < minV[r] - 1e-9) { minV[r] = smin[r]; minInfo[r] = { p, dir, vs }; }
          }
        }
      }
    }
    return { max: maxV, min: minV, maxInfo, minInfo, rec };
  }

  /* two identical trucks, same direction, clear gap >= gap between rear of lead and front of trailing */
  function dualCombine(rf, q, truckLen, gap, sense) {
    let best = 0, info = null;
    for (const dir of [1, -1]) {
      const d = rf.f[dir]; if (!d) continue;
      const f = sense === 'min' ? d.arr[q].mn : d.arr[q].mx;
      const g = Math.ceil((truckLen + gap) / d.step - 1e-9);
      let run = sense === 'min' ? Infinity : -Infinity, runK = -1;
      for (let k = g; k < d.n; k++) {
        const v0 = f[k - g];
        if (sense === 'min' ? v0 < run : v0 > run) { run = v0; runK = k - g; }
        const cand = f[k] + run;
        if (sense === 'min' ? cand < best - 1e-9 : cand > best + 1e-9) { best = cand; info = { pA: d.p0 + k * d.step, pB: d.p0 + runK * d.step, dir }; }
      }
    }
    return { val: best, info };
  }

  /* LFD impact 50/(L+125) <= 0.30 */
  const lfdI = L => Math.min(0.3, 50 / (Math.max(L, 0) + 125));
  function lfdImpactLengths(m, q, sense) {
    const sp = m.spans, n = sp.length;
    if (q.type === 'R') {
      const j = q.j;
      if (j === 0) return sp[0]; if (j === n) return sp[n - 1];
      return 0.5 * (sp[j - 1] + sp[j]);
    }
    const s = m.sections[q.sec], i = s.span, L = sp[i];
    if (q.type === 'M') {
      if (sense === 'max' || n === 1) return L;
      const nb = s.frac >= 0.5 ? i + 1 : i - 1;
      return (nb >= 0 && nb < n) ? 0.5 * (L + sp[nb]) : L;
    }
    const x0 = m.sup[i], x1 = m.sup[i + 1];
    return sense === 'max' ? (x1 - s.x) : (s.x - x0);
  }

  /* ---------------- Full analysis ---------------- */
  function analyze(inp) {
    const t0 = Date.now();
    const m = buildModel(inp);
    if (m.errors) return m;
    const il = influenceData(m);
    const nr = m.resp.length, nsp = m.spans.length;
    const o = inp.options || {};
    const step = num(o.step, 0.5), varInc = num(o.varInc, 1), neglectDesign = o.neglectDesign !== false, neglectPermit = !!o.neglectPermit;
    const out = { model: m, il, families: [], warnings: [] };

    // design truck run (unit HS20/HL-93 truck), records 14-ft variant for dual-truck
    const interiorR = m.reactRows.filter((r, k) => k > 0 && k < m.nsup - 1);
    const dualIdx = [];
    m.resp.forEach((q, r) => { if (q.type === 'M') dualIdx.push(r); });
    interiorR.forEach(r => dualIdx.push(r));
    const needTruck = (o.hl93 && o.hl93.on) || (o.hs && o.hs.on);
    let T = null;
    if (needTruck) T = runVehicle(m, { weights: [8, 32, 32], spacings: [14, 14], varIndex: 1, varMin: 14, varMax: 30, varInc }, { step, neglect: neglectDesign, record: dualIdx, recordVar: 14 });

    const comp = (q, r) => ({ type: q.type, r });

    /* ---- HL-93 ---- */
    if (o.hl93 && o.hl93.on) {
      const h = o.hl93, IM = num(h.im, 33) / 100, w = num(h.lane, 0.64);
      const dfM = num(h.dfM, 1), dfV = num(h.dfV, 1);
      const TD = runVehicle(m, { weights: [25, 25], spacings: [4], varIndex: -1 }, { step, neglect: neglectDesign });
      const dualOn = nsp > 1 && h.dual !== 'off';
      const fam = { id: 'hl93', name: 'HL-93', code: 'AASHTO LRFD', max: new Float64Array(nr), min: new Float64Array(nr), detail: [] };
      const dqIndex = new Map(dualIdx.map((r, q) => [r, q]));
      for (let r = 0; r < nr; r++) {
        const q = m.resp[r], L = il[r], df = q.type === 'M' ? dfM : dfV;
        const laneP = w * L.pos, laneN = w * L.neg;
        const tr = { max: T.max[r] * (1 + IM) + laneP, min: T.min[r] * (1 + IM) + laneN };
        const td = { max: TD.max[r] * (1 + IM) + laneP, min: TD.min[r] * (1 + IM) + laneN };
        let mx = tr.max, mxC = 'Truck + Lane', mn = tr.min, mnC = 'Truck + Lane';
        let mxInfo = T.maxInfo[r], mnInfo = T.minInfo[r];
        if (td.max > mx) { mx = td.max; mxC = 'Tandem + Lane'; mxInfo = TD.maxInfo[r]; }
        if (td.min < mn) { mn = td.min; mnC = 'Tandem + Lane'; mnInfo = TD.minInfo[r]; }
        const d = { truckMax: T.max[r], truckMin: T.min[r], tandemMax: TD.max[r], tandemMin: TD.min[r], laneP, laneN, IM, mxInfo, mnInfo, dualMin: null, dualMax: null };
        if (dualOn && dqIndex.has(r)) {
          const qi = dqIndex.get(r);
          if (q.type === 'M') {
            const unif = L.pos + L.neg;
            if (h.dual === 'all' || unif < 0) {
              const dc = dualCombine(T.rec, qi, 28, 50, 'min');
              const v = 0.9 * (dc.val * (1 + IM) + laneN);
              d.dualMin = dc.val; d.dualInfo = dc.info;
              if (v < mn) { mn = v; mnC = '90% (Dual Truck + Lane)'; d.mnInfo = null; }
            }
          } else if (q.type === 'R') {
            const dc = dualCombine(T.rec, qi, 28, 50, 'max');
            const v = 0.9 * (dc.val * (1 + IM) + laneP);
            d.dualMax = dc.val; d.dualInfo = dc.info;
            if (v > mx) { mx = v; mxC = '90% (Dual Truck + Lane)'; d.mxInfo = null; }
          }
        }
        fam.max[r] = mx * df; fam.min[r] = mn * df; d.ctrlMax = mxC; d.ctrlMin = mnC; d.df = df;
        fam.detail.push(d);
      }
      out.families.push(fam);

      if (h.fatigue) {
        const IMf = num(h.imFat, 15) / 100;
        const F = runVehicle(m, { weights: [8, 32, 32], spacings: [14, 30], varIndex: -1 }, { step, neglect: neglectDesign });
        const ff = { id: 'fat', name: 'LRFD Fatigue', code: 'AASHTO LRFD', max: new Float64Array(nr), min: new Float64Array(nr), detail: [] };
        for (let r = 0; r < nr; r++) {
          const q = m.resp[r], df = q.type === 'M' ? dfM : dfV;
          ff.max[r] = F.max[r] * (1 + IMf) * df; ff.min[r] = F.min[r] * (1 + IMf) * df;
          ff.detail.push({ truckMax: F.max[r], truckMin: F.min[r], IM: IMf, df, ctrlMax: 'Fatigue Truck', ctrlMin: 'Fatigue Truck', mxInfo: F.maxInfo[r], mnInfo: F.minInfo[r] });
        }
        out.families.push(ff);
      }
    }

    /* ---- LFD HS: truck and lane reported as separate envelopes ---- */
    if (o.hs && o.hs.on) {
      const s = o.hs, sc = num(s.scale, 1);
      const laneOn = s.laneOn !== false, truckOn = s.truckOn !== false;
      const w = num(s.laneW, 0.64) * sc, PM = num(s.lanePM, 18) * sc, PV = num(s.lanePV, 26) * sc, use2 = s.lane2nd !== false;
      const dfM = num(s.dfM, 1), dfV = num(s.dfV, 1);
      const Iovr = (s.impact === '' || s.impact == null || !Number.isFinite(parseFloat(s.impact))) ? null : parseFloat(s.impact) / 100;
      const MIL = s.military ? runVehicle(m, { weights: [24, 24], spacings: [4], varIndex: -1 }, { step, neglect: neglectDesign }) : null;
      const label = 'HS' + fmt(20 * sc);
      const mk = (id, name) => ({ id, name, code: 'AASHTO Std (LFD)', max: new Float64Array(nr), min: new Float64Array(nr), detail: [] });
      const ft = mk('hs', label + ' Truck' + (MIL ? ' / Military' : ''));
      const fl = mk('hsl', label + ' Lane');
      const fg = mk('hsg', label + ' Governing');
      for (let r = 0; r < nr; r++) {
        const q = m.resp[r], L = il[r], df = q.type === 'M' ? dfM : dfV;
        const Pc = q.type === 'M' ? PM : PV;
        const Ip = Iovr != null ? Iovr : lfdI(lfdImpactLengths(m, q, 'max'));
        const In = Iovr != null ? Iovr : lfdI(lfdImpactLengths(m, q, 'min'));
        // truck (+ military)
        const truckMax = T.max[r] * sc, truckMin = T.min[r] * sc;
        const milMax = MIL ? MIL.max[r] : 0, milMin = MIL ? MIL.min[r] : 0;
        let tMx = truckMax, tMxC = 'Truck', tMn = truckMin, tMnC = 'Truck', tMxI = T.maxInfo[r], tMnI = T.minInfo[r];
        if (milMax > tMx) { tMx = milMax; tMxC = 'Military'; tMxI = MIL.maxInfo[r]; }
        if (milMin < tMn) { tMn = milMin; tMnC = 'Military'; tMnI = MIL.minInfo[r]; }
        ft.max[r] = tMx * (1 + Ip) * df; ft.min[r] = tMn * (1 + In) * df;
        ft.detail.push({ kind: 'truck', truckMax, truckMin, milMax, milMin, Ip, In, df, ctrlMax: tMxC, ctrlMin: tMnC, mxInfo: tMxI, mnInfo: tMnI });
        // lane breakout
        const uP = w * L.pos, uN = w * L.neg;
        const cP = L.maxOrd > 0 ? Pc * L.maxOrd : 0, cPx = L.maxOrd > 0 ? L.maxX : null;
        const cN = L.minOrd < 0 ? Pc * L.minOrd : 0, cNx = L.minOrd < 0 ? L.minX : null;
        let c2 = 0, c2x = null;
        if (use2 && q.type === 'M' && nsp > 1 && L.minOrd < 0) {
          const minSpan = m.spanOf(L.minX);
          const sm = L.spanMin.map((v, k) => ({ v, k, x: L.spanMinX[k] })).filter(z => z.v < 0 && z.k !== minSpan).sort((a, b) => a.v - b.v);
          if (sm.length) { c2 = PM * sm[0].v; c2x = sm[0].x; }
        }
        const laneMax = uP + cP, laneMin = uN + cN + c2;
        fl.max[r] = laneMax * (1 + Ip) * df; fl.min[r] = laneMin * (1 + In) * df;
        fl.detail.push({ kind: 'lane', w, Pc, uP, uN, cP, cPx, cN, cNx, c2, c2x, laneMax, laneMin, areaP: L.pos, areaN: L.neg, ordP: L.maxOrd, ordN: L.minOrd, Ip, In, df,
          ctrlMax: 'Lane', ctrlMin: c2 ? 'Lane (2 conc. loads)' : 'Lane', mxInfo: null, mnInfo: null });
        // governing
        const gMx = Math.max(ft.max[r], fl.max[r]), gMn = Math.min(ft.min[r], fl.min[r]);
        fg.max[r] = gMx; fg.min[r] = gMn;
        fg.detail.push({ kind: 'gov', Ip, In, df, ctrlMax: fl.max[r] > ft.max[r] ? 'Lane' : tMxC, ctrlMin: fl.min[r] < ft.min[r] ? fl.detail[r].ctrlMin : tMnC,
          mxInfo: fl.max[r] > ft.max[r] ? null : tMxI, mnInfo: fl.min[r] < ft.min[r] ? null : tMnI });
      }
      if (truckOn) out.families.push(ft);
      if (laneOn) out.families.push(fl);
      if (s.governing && truckOn && laneOn) out.families.push(fg);
    }

    /* ---- AASHTO legal loads (MBE 6A.4.4.2.1a, Appendix D6A) ----
       Envelope of Type 3, 3S2, 3-3 (IM on vehicles) and the lane-type model:
       negative moment and interior reactions on continuous spans: 0.75 x two Type 3-3, same direction,
       30 ft clear, + 0.2 klf on adverse portions (no IM on lane); spans > 200 ft: 0.75 x Type 3-3 + 0.2 klf, all effects.
       ADTT < 500 option: lane omitted and 1.0 in place of 0.75. */
    if (o.legal && o.legal.on) {
      const g = o.legal, IM = num(g.im, 33) / 100, dfM = num(g.dfM, 1), dfV = num(g.dfV, 1);
      const low = !!g.lowADTT, fac = low ? 1 : 0.75, wl = low ? 0 : num(g.lane, 0.2), gap = 30, neg = g.neglect !== false;
      const VEH = [
        { id: 'lg3', name: 'Type 3', w: [16, 17, 17], s: [15, 4] },
        { id: 'lg3s2', name: 'Type 3S2', w: [10, 15.5, 15.5, 15.5, 15.5], s: [11, 4, 22, 4] },
        { id: 'lg33', name: 'Type 3-3', w: [12, 12, 12, 16, 14, 14], s: [15, 4, 15, 16, 4] }];
      const RV = VEH.map((v, k) => runVehicle(m, { weights: v.w, spacings: v.s, varIndex: -1 }, k === 2 ? { step, neglect: neg, record: dualIdx } : { step, neglect: neg }));
      const T33 = RV[2], len33 = 54, lq = new Map(dualIdx.map((r, q) => [r, q]));
      const longSpan = q => q.type === 'R' ? [m.spans[q.j - 1], m.spans[q.j]].some(L => L > 200) : m.spans[m.sections[q.sec].span] > 200;
      const mk = (id, name) => ({ id, name, code: 'MBE 6A.4.4.2.1a', max: new Float64Array(nr), min: new Float64Array(nr), detail: [] });
      const env = mk('legal', 'AASHTO Routine Commercial');
      const sep = g.separate ? VEH.map(v => mk(v.id, v.name)) : null;
      const lt = g.separate ? mk('lglane', 'Legal Lane-Type') : null;
      const pre = low ? '' : '0.75 × ', post = low ? ' (ADTT < 500)' : ' + lane';
      for (let r = 0; r < nr; r++) {
        const q = m.resp[r], L = il[r], df = q.type === 'M' ? dfM : dfV;
        const laneP = wl * L.pos, laneN = wl * L.neg;
        const d = { legal: true, IM, df, fac, wl, low, laneP, laneN, long: longSpan(q), veh: VEH.map((v, k) => ({ name: v.name, max: RV[k].max[r], min: RV[k].min[r] })),
          longMax: null, longMin: null, dualMax: null, dualMin: null, dualInfo: null };
        let mx = 0, mxC = 'None', mxI = null, mn = 0, mnC = 'None', mnI = null;
        VEH.forEach((v, k) => {
          const a = RV[k].max[r] * (1 + IM), b = RV[k].min[r] * (1 + IM);
          if (sep) { sep[k].max[r] = a * df; sep[k].min[r] = b * df;
            sep[k].detail.push({ truckMax: RV[k].max[r], truckMin: RV[k].min[r], Ip: IM, In: IM, laneP: 0, laneN: 0, df, ctrlMax: v.name, ctrlMin: v.name, mxInfo: RV[k].maxInfo[r], mnInfo: RV[k].minInfo[r] }); }
          if (a > mx + 1e-9) { mx = a; mxC = v.name; mxI = RV[k].maxInfo[r]; }
          if (b < mn - 1e-9) { mn = b; mnC = v.name; mnI = RV[k].minInfo[r]; }
        });
        // lane-type model
        let lx = 0, lxC = 'Not applicable', lxI = null, lxD = false, ln = 0, lnC = 'Not applicable', lnI = null, lnD = false;
        if (d.long) {
          d.longMax = T33.max[r]; d.longMin = T33.min[r];
          lx = fac * T33.max[r] * (1 + IM) + laneP; ln = fac * T33.min[r] * (1 + IM) + laneN;
          lxC = lnC = `Lane-type: ${pre}Type 3-3${post}`; lxI = T33.maxInfo[r]; lnI = T33.minInfo[r];
        }
        if (nsp > 1 && lq.has(r)) {
          const qi = lq.get(r);
          if (q.type === 'M') {
            const dc = dualCombine(T33.rec, qi, len33, gap, 'min'), v = fac * dc.val * (1 + IM) + laneN;
            d.dualMin = dc.val; d.dualInfo = dc.info;
            if (v < ln - 1e-9) { ln = v; lnC = `Lane-type: ${pre}two Type 3-3${post}`; lnI = null; lnD = true; }
          } else {
            const dc = dualCombine(T33.rec, qi, len33, gap, 'max'), v = fac * dc.val * (1 + IM) + laneP;
            d.dualMax = dc.val; d.dualInfo = dc.info;
            if (v > lx + 1e-9) { lx = v; lxC = `Lane-type: ${pre}two Type 3-3${post}`; lxI = null; lxD = true; }
          }
        }
        if (lt) { lt.max[r] = lx * df; lt.min[r] = ln * df;
          lt.detail.push(Object.assign({}, d, { lane: true, ctrlMax: lxC, ctrlMin: lnC, mxInfo: lxI, mnInfo: lnI, mxDual: lxD, mnDual: lnD })); }
        if (lx > mx + 1e-9) { mx = lx; mxC = lxC; mxI = lxI; d.mxDual = lxD; }
        if (ln < mn - 1e-9) { mn = ln; mnC = lnC; mnI = lnI; d.mnDual = lnD; }
        env.max[r] = mx * df; env.min[r] = mn * df;
        d.ctrlMax = mxC; d.ctrlMin = mnC; d.mxInfo = mxI; d.mnInfo = mnI;
        env.detail.push(d);
      }
      out.families.push(env);
      if (sep) out.families.push(...sep, lt);
    }

    /* ---- Permits ---- */
    (o.permits || []).filter(p => p.on).forEach((p, pi) => {
      const wts = String(p.weights).split(/[,;\s]+/).map(Number).filter(Number.isFinite);
      const sps = String(p.spacings).split(/[,;\s]+/).map(Number).filter(Number.isFinite);
      if (!wts.length || sps.length !== wts.length - 1 || wts.some(v => v < 0) || sps.some(v => v < 0)) {
        out.warnings.push(`Permit "${p.name || pi + 1}" skipped: needs N axle weights and N-1 spacings.`); return;
      }
      const sc = num(p.scale, 1), lw = num(p.lane, 0), dfM = num(p.dfM, 1), dfV = num(p.dfV, 1);
      const P = runVehicle(m, { weights: wts.map(v => v * sc), spacings: sps, varIndex: -1 }, { step, neglect: neglectPermit });
      const fam = { id: 'permit' + pi, name: p.name || ('Permit ' + (pi + 1)), code: 'Permit', max: new Float64Array(nr), min: new Float64Array(nr), detail: [],
        gross: wts.reduce((a, b) => a + b, 0) * sc, length: sps.reduce((a, b) => a + b, 0) };
      for (let r = 0; r < nr; r++) {
        const q = m.resp[r], L = il[r], df = q.type === 'M' ? dfM : dfV;
        let Ip, In;
        if (p.impactMode === 'lfd') { Ip = lfdI(lfdImpactLengths(m, q, 'max')); In = lfdI(lfdImpactLengths(m, q, 'min')); }
        else { Ip = In = num(p.im, 0) / 100; }
        // lane: all effects (default) or negative moment only (MBE 6A.4.5.4.1, continuous spans)
        const negOnly = p.laneApply === 'neg', onP = lw && !negOnly, onN = lw && (!negOnly || q.type === 'M');
        const laneP = onP ? lw * L.pos : 0, laneN = onN ? lw * L.neg : 0;
        fam.max[r] = (P.max[r] * (1 + Ip) + laneP) * df; fam.min[r] = (P.min[r] * (1 + In) + laneN) * df;
        fam.detail.push({ truckMax: P.max[r], truckMin: P.min[r], Ip, In, laneP, laneN, df, ctrlMax: onP ? 'Permit + Lane' : 'Permit', ctrlMin: onN ? 'Permit + Lane' : 'Permit', mxInfo: P.maxInfo[r], mnInfo: P.minInfo[r] });
      }
      out.families.push(fam);
    });

    out.ms = Date.now() - t0;
    return out;
  }

  return { buildModel, reactions, influenceData, runVehicle, analyze, lfdI };
})();
if (typeof module !== 'undefined') module.exports = ConsysEngine;

</script>

function permitSummary(p) {
  const w = String(p.weights).split(/[,;\s]+/).map(Number).filter(Number.isFinite);
  const s = String(p.spacings).split(/[,;\s]+/).map(Number).filter(Number.isFinite);
  if (!w.length) return 'Enter axle weights.';
  if (s.length !== w.length - 1) return `<span style="color:var(--bad)">${w.length} axles need ${w.length - 1} spacings (have ${s.length}).</span>`;
  const sc = parseFloat(p.scale) || 1;
  return `${w.length} axles · ${f1(w.reduce((a, b) => a + b, 0) * sc)} k gross · ${f1(s.reduce((a, b) => a + b, 0))} ft long`;
}

function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;

}
function schedule(ms = 450) { clearTimeout(timer); $('#busy').textContent = 'Updating…'; timer = setTimeout(run, ms); }

/* ======================= RUN ======================= */
function run() {
  clearTimeout(timer);
  $('#busy').textContent = 'Analyzing…';
  setTimeout(() => {
    try { RES = E.analyze(S); }
    catch(err) { RES = { errors:['Analysis failed: ' + err.message] }; console.error(err); }
    if (RES && !RES.errors) {
      if (selSec == null || selSec >= RES.model.sections.length) { const k = RES.model.sections.findIndex(q => q.side === 'L' && q.span < RES.model.spans.length - 1); selSec = k >= 0 ? k : Math.floor(RES.model.sections.length / 2); }
      if (ilResp == null || ilResp >= RES.model.resp.length) ilResp = RES.model.sections[selSec].iM;
      $('#busy').textContent = `Solved in ${RES.ms} ms`;

}

function notesItems() {
  const perLane = isPerLane();
  return `
      <li>Continuous beam solved by the direct stiffness method with Euler–Bernoulli elements. Each segment carries its own E and I (linearly varying I is discretized per element). Supports are vertical restraints with free rotation.</li>
      <li>Influence lines are exact for the discretized beam: a point load anywhere in an element is applied through Hermite equivalent nodal loads; moments and shears follow from statics on the support reactions.</li>
      <li>Vehicles run both directions in ${f2(+S.options.step || 0.5)} ft steps, plus every position that puts an axle on an analysis point or support. Variable axle spacing is searched from 14 to 30 ft in ${f2(+S.options.varInc || 1)} ft increments.</li>
      <li><b>HL-93</b> (LRFD 3.6.1.2–3.6.1.3): max of truck + lane and tandem + lane; IM applies to truck and tandem only. 90% of two design trucks (14 ft rear spacing, ≥ 50 ft between them) plus 90% lane for negative moment ${S.options.hl93.dual === 'all' ? 'at all points' : 'between points of contraflexure under uniform load'} and for interior-support reactions. Lane load is placed on the adverse portions of the influence line.</li>
      <li><b>HS loading</b> (Standard Spec 3.7, 3.11): reported as separate envelopes. <b>Truck</b> is the HS truck with 14–30 ft variable rear spacing (and Alternate Military Loading if checked). <b>Lane</b> is the uniform load on the matching-sign portions of the influence line plus the concentrated load (moment value for moments, shear value for shears and reactions) at the peak ordinate; for negative moment on continuous spans a second concentrated load is placed in another span. <b>Governing</b> is the larger of the two at each point. Impact I = 50/(L + 125) ≤ 30% applies to both. L = span for +M, average of the span and its nearer neighbor for −M, distance to the far end of the span for shear, and average of adjacent spans for interior reactions.</li>
      <li><b>AASHTO routine commercial load effects</b> (MBE 6A.4.4.2.1a, Appendix D6A): envelope of the Type 3, Type 3S2 and Type 3-3 trucks with IM, and the lane-type model. For negative moment and interior reactions on continuous spans the lane-type model is 0.75 × two Type 3-3 trucks in the same direction with 30 ft clear between them, plus 0.2 klf on adverse portions; for spans over 200 ft it is 0.75 × one Type 3-3 plus 0.2 klf for all effects. IM applies to the trucks, not the lane. The ADTT &lt; 500 option omits the lane and uses 1.0 in place of 0.75. Negative moment is checked at every analysis point. Load effects only, not a complete legal-load rating: no rating factors are computed, and specialized hauling vehicles (SU4–SU7), emergency vehicles and state legal loads, which may also be required for rating, are not included.</li>
      <li><b>Permits</b> run as entered (all axles included unless you turn on the neglect option), with a fixed impact or the LFD formula, plus an optional lane load on adverse portions without impact, applied to all effects or to negative moment only.</li>
      <li><b>Distribution factors</b> are simple scaling factors on the per-lane results; the default of 1.0 gives per-lane values. No multiple presence, number of lanes, girder-spacing formula or other distribution calculation is applied. The HS factors are per-lane multipliers, not per wheel line. The fatigue truck uses the HL-93 factors. ${perLane ? 'All values here are per lane.' : 'Moment factors are applied to moments, shear factors to shears and reactions.'}</li>
      <li>Reactions are upward-positive (bearing load).</li>
      <li>Check results against an independent method before using them for design or rating.</li>`;
}

function isPerLane() {

  return (!o.hl93.on || pair(o.hl93)) && (!o.hs.on || pair(o.hs)) && (!(o.legal && o.legal.on) || pair(o.legal)) && o.permits.every(p => !p.on || pair(p));

function legalWarn() {
  if ((S.options.legal && S.options.legal.on) || !RES || RES.errors || RES.model.spans.length < 2) return [];
  const norm = v => String(v).split(/[,;\s]+/).map(Number).filter(Number.isFinite).join(',');
  const sig = ['type3', 'type3s2', 'type33'].map(k => norm(PRESETS[k].weights) + '|' + norm(PRESETS[k].spacings));
  const hit = S.options.permits.filter(p => p.on && sig.includes(norm(p.weights) + '|' + norm(p.spacings)));
  if (!hit.length) return [];
  return [`${hit.map(p => p.name || 'Permit').join(', ')}: AASHTO legal truck${hit.length > 1 ? 's' : ''} on a continuous beam. MBE 6A.4.4.2.1a also requires the lane-type model (0.75 × two Type 3-3 trucks + 0.2 klf) for negative moment and interior reactions. Turn on AASHTO routine commercial load effects to include it.`];
}

function niceTicks(lo, hi, n = 6) {

  m.segs.forEach((g, i) => {
    const h1 = 6 + 20 * g.I1 / Imax, h2 = 6 + 20 * g.I2 / Imax;
    s += `<path d="M${X(g.x0)},${base}L${X(g.x1)},${base}L${X(g.x1)},${base - h2}L${X(g.x0)},${base - h1}Z" fill="${i % 2 ? 'var(--accent-soft)' : 'var(--panel-2)'}" stroke="var(--ink-2)" stroke-width="1"><title>Segment ${i + 1}: ${f2(g.x1 - g.x0)} ft, E = ${g.E} ksi, I = ${g.I1}${g.I2 !== g.I1 ? '→' + g.I2 : ''} in⁴</title></path>`;
  });
  m.sections.forEach((q, i) => { if (q.side === 'B') s += `<line x1="${X(q.x)}" x2="${X(q.x)}" y1="${base + 2}" y2="${base + 6}" stroke="var(--ink-3)"/>`; });
  m.sup.forEach((x, j) => {
    s += `<path d="M${X(x)},${base}l-8,13h16Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.3"/>`;
    s += `<text class="ax" x="${X(x)}" y="${base + 27}" text-anchor="middle">${j + 1}</text>`;
  });
  m.spans.forEach((L, i) => {
    const a = X(m.sup[i]), b = X(m.sup[i + 1]), y = base + 44;
    s += `<line x1="${a}" x2="${b}" y1="${y}" y2="${y}" stroke="var(--ink-3)"/><line x1="${a}" x2="${a}" y1="${y - 4}" y2="${y + 4}" stroke="var(--ink-3)"/><line x1="${b}" x2="${b}" y1="${y - 4}" y2="${y + 4}" stroke="var(--ink-3)"/>`;
    s += `<rect x="${(a + b) / 2 - 34}" y="${y - 8}" width="68" height="16" fill="var(--panel)"/><text class="ax" x="${(a + b) / 2}" y="${y + 4}" text-anchor="middle" style="fill:var(--ink-2)">${f2(L)} ft</text>`;
  });
  const sx = X(m.sections[selSec].x);
  s += `<path d="M${sx},${base - 36}l-5,-8h10Z" fill="var(--accent)"/>`;
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Beam elevation with supports and segments">${s}</svg></div>
    <p class="hint" style="margin:0">Segment depth is drawn proportional to I. Ticks mark analysis points; the marker shows the selected point.</p>`;
}

/* ---------- CSV ---------- */
function exportCSV() {
  if (!RES || RES.errors) { alert('Run a valid analysis first.'); return; }
  const m = RES.model, fams = RES.families, q = v => `"${String(v).replace(/"/g, '""')}"`;
  const L = [];
  L.push(['Project', q(S.project.name)].join(','), ['Notes', q(S.project.notes)].join(','));
  L.push(['Spans (ft)', ...m.spans].join(','));
  L.push(['Segments', 'Length ft', 'E ksi', 'I start in4', 'I end in4'].join(','));
  m.segs.forEach((g, i) => L.push([i + 1, f2(g.x1 - g.x0), g.E, g.I1, g.I2].join(',')));
  L.push(['Results', isPerLane() ? 'per lane' : 'distribution factors applied'].join(','), '');
  ['M', 'V'].forEach(type => {
    L.push(type === 'M' ? 'MOMENT (k-ft)' : 'SHEAR (k)');
    L.push(['Span', 'x/L', 'Side', 'x ft', ...fams.flatMap(f => [q(f.name + ' +' + type), q(f.name + ' -' + type), q(f.name + ' +ctrl'), q(f.name + ' -ctrl')])].join(','));
    m.sections.forEach(s => {
      if (type === 'M' && s.side === 'R' && s.span > 0) return;
      const r = type === 'M' ? s.iM : s.iV;
      L.push([s.span + 1, s.frac.toFixed(4), s.side === 'L' ? 'left' : s.side === 'R' ? 'right' : '', f2(s.x), ...fams.flatMap(f => [f1(f.max[r]), f1(f.min[r]), q(f.detail[r].ctrlMax), q(f.detail[r].ctrlMin)])].join(','));
    });
    L.push('');
  });
  L.push('REACTIONS (k)');
  L.push(['Support', 'x ft', ...fams.flatMap(f => [q(f.name + ' max'), q(f.name + ' min')])].join(','));
  m.reactRows.forEach((r, j) => L.push([j + 1, f2(m.sup[j]), ...fams.flatMap(f => [f1(f.max[r]), f1(f.min[r])])].join(',')));
  download((S.project.name || 'beam').replace(/[^\w\-]+/g, '_') + '_envelopes.csv', L.join('\r\n'), 'text/csv');
}

renderInputs();
run();
})();
</script>
<script>
(() => {
  const root=document.documentElement, button=document.getElementById('themeSwitch');
  const media=matchMedia('(prefers-color-scheme: dark)');
  function dark(){return root.dataset.theme ? root.dataset.theme==='dark' : media.matches}
  function label(){button.textContent=dark()?'Light mode':'Dark mode';button.setAttribute('aria-label',dark()?'Switch to light mode':'Switch to dark mode')}
  button.addEventListener('click',()=>{const next=dark()?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('opendot-bridge-se-theme',next)}catch(e){}label()});
  media.addEventListener('change',label);label();
  const header=document.querySelector('header.top');
  function height(){root.style.setProperty('--top-height',Math.ceil(header.getBoundingClientRect().height)+'px')}
  if('ResizeObserver' in window)new ResizeObserver(height).observe(header);
  height();
})();
</script>
